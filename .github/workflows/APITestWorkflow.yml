# Riwayat perbaikan workflow ini (run #1 di main gagal total):
#   1. Job "build" gagal karena test memakai token JWT hardcoded yang sudah
#      kedaluwarsa, sehingga GET /api/auth/me balas 401 (lihat APITest.java).
#   2. Job "dependency-submission" gagal karena fitur "Dependency graph"
#      belum aktif di setelan repository.
# Perubahan di bawah menutup penyebab nomor 2 dan merapikan langkah build;
# penyebab nomor 1 diperbaiki langsung di kode test.

name: API Test Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # "./gradlew build" sudah menjalankan task test, jadi versi lama
    # mengeksekusi seluruh test dua kali (build lalu clean test) dan
    # membuang waktu runner. Tahap build sekarang dilakukan tanpa test,
    # eksekusi test dipisah ke langkah berikutnya.
    - name: Build with Gradle Wrapper
      run: ./gradlew build -x test

    - name: Run Tests
      run: ./gradlew test

    # Allure report berguna untuk menelusuri penyebab test gagal, tapi
    # file-nya hanya ada di runner. Diunggah sebagai artifact (juga saat
    # test gagal) supaya bisa diunduh dari halaman run.
    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: build/reports/allure-report
        if-no-files-found: ignore

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  dependency-submission:

    # Job ini butuh "Dependency graph" aktif di Settings > Code security.
    # Selama belum aktif, submit snapshot selalu gagal dengan
    # "The Dependency graph is disabled for this repository", sehingga
    # seluruh workflow ikut merah padahal test-nya sendiri lulus.
    # Memakai continue-on-error tidak cukup: run memang jadi hijau, tapi
    # check job-nya tetap tampil gagal di halaman pull request.
    # Karena itu job di-skip lewat kondisi di bawah. Setelah Dependency
    # graph diaktifkan, set repository variable
    # ENABLE_DEPENDENCY_SUBMISSION = true untuk menyalakannya kembali.
    if: vars.ENABLE_DEPENDENCY_SUBMISSION == 'true'

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
